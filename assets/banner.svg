<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Wave Elements -->
  <g opacity="0.25">
    <path d="M0,220 Q 300,160 600,240 T 1200,180 L 1200,320 L 0,320 Z" fill="url(#accentGrad1)">
      <animate attributeName="d" 
               dur="10s" 
               repeatCount="indefinite" 
               values="M0,220 Q 300,160 600,240 T 1200,180 L 1200,320 L 0,320 Z;
                       M0,200 Q 300,260 600,180 T 1200,230 L 1200,320 L 0,320 Z;
                       M0,220 Q 300,160 600,240 T 1200,180 L 1200,320 L 0,320 Z"/>
    </path>
    <path d="M0,250 Q 300,290 600,200 T 1200,260 L 1200,320 L 0,320 Z" fill="url(#cyanGrad)" opacity="0.6">
      <animate attributeName="d" 
               dur="8s" 
               repeatCount="indefinite" 
               values="M0,250 Q 300,290 600,200 T 1200,260 L 1200,320 L 0,320 Z;
                       M0,230 Q 300,180 600,270 T 1200,210 L 1200,320 L 0,320 Z;
                       M0,250 Q 300,290 600,200 T 1200,260 L 1200,320 L 0,320 Z"/>
    </path>
  </g>

  <!-- Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="100" fill="#8b5cf6" filter="blur(60px)" opacity="0.3"/>
  <circle cx="1050" cy="240" r="120" fill="#06b6d4" filter="blur(60px)" opacity="0.25"/>

  <!-- Dynamic Pulse Lines / Metrics Graph Visual (Subtle Background Detail) -->
  <path d="M 100 250 L 250 230 L 380 260 L 500 190 L 650 220 L 800 150 L 950 180 L 1100 120" 
        fill="none" stroke="url(#accentGrad1)" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,1500; 1500,0" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="500" cy="190" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="150" r="4"><animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="120" r="4"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- FOREGROUND CONTENT - High Contrast & Crisp -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Top Pill / Badge -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="0" y="-64" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
      ⚡ CURATED OBSERVABILITY STACK
    </text>

    <!-- Main Title -->
    <text x="0" y="-10" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Cloud Monitoring &amp; Observability
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">
      Metrics • Logs • Traces • APM • OpenTelemetry • Incident Management
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 75)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
      <!-- Tag 1 -->
      <rect x="-210" y="-15" width="130" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="-145" y="4" fill="#38bdf8" text-anchor="middle">☁️ SaaS Platforms</text>
      
      <!-- Tag 2 -->
      <rect x="-65" y="-15" width="130" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" fill="#34d399" text-anchor="middle">🔓 Open-Source</text>

      <!-- Tag 3 -->
      <rect x="80" y="-15" width="130" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="145" y="4" fill="#fbbf24" text-anchor="middle">📊 Market Data</text>
    </g>
  </g>
</svg>
